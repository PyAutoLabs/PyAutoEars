name: Ears tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          path: PyAutoEars
      - uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoBrain
          path: PyAutoBrain
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r PyAutoEars/requirements-dev.txt
      - run: python -m pytest -q PyAutoEars/tests
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: PyAutoEars
      - uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoBrain
          path: PyAutoBrain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r PyAutoEars/requirements-dev.txt 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/board_browser.py
        working-directory: PyAutoEars
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ears-synthetic-browser-evidence
          path: PyAutoEars/_site/browser-fixture/
